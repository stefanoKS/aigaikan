# Modbus holding-register specification. All addresses are ZERO-BASED offsets.
# GX Works3 mappings are configured independently in the iQ-R CPU/Ethernet module.
plc_to_pc:
	start: 100
	count: 20
	registers:
		100: PLC_CONTROL_WORD
		101: REQUESTED_RECIPE_ID
		102: REQUESTED_RECIPE_REV
		103: RECIPE_CHANGE_SEQ_LO
		104: RECIPE_CHANGE_SEQ_HI
		105: LINE_SPEED_X100
		106: PLC_LINE_STATE
		107: PLC_TRIGGER_SEQ_LO
		108: PLC_TRIGGER_SEQ_HI
		109: RESULT_ACK_SEQ_LO
		110: RESULT_ACK_SEQ_HI
		111: PLC_HEARTBEAT
		112: PLC_FAULT_CODE
		113: PLC_COMMAND_CODE
		114: PLC_COMMAND_SEQ
		115: PRODUCT_LENGTH_MM
pc_to_plc:
	start: 120
	count: 30
	registers:
		120: PC_STATUS_WORD
		121: ACTIVE_RECIPE_ID
		122: ACTIVE_RECIPE_REV
		123: RECIPE_ACK_SEQ_LO
		124: RECIPE_ACK_SEQ_HI
		125: RESULT_SEQ_LO
		126: RESULT_SEQ_HI
		127: RESULT_CODE
		128: NG_CAMERA_MASK
		129: FUSED_SCORE_X10000
		130: CAM0_SCORE_X10000
		131: CAM1_SCORE_X10000
		132: CAM2_SCORE_X10000
		133: CAM3_SCORE_X10000
		134: INFERENCE_TIME_MS
		135: CAMERA_READY_MASK
		136: MODEL_READY_MASK
		137: PC_HEARTBEAT
		138: VISION_ERROR_CODE
		139: VISION_WARNING_CODE
		140: INFERENCE_QUEUE_DEPTH
		141: DROPPED_TRIGGER_COUNT_LO
		142: DROPPED_TRIGGER_COUNT_HI
		143: MISSING_FRAME_COUNT_LO
		144: MISSING_FRAME_COUNT_HI
		145: PROCESSED_COUNT_LO
		146: PROCESSED_COUNT_HI
		147: COMMAND_ACK_SEQ